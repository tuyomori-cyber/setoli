<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setoli</title>
  <link rel="stylesheet" href="setoli.css">
</head>
<body>
  <header><h1>Setoli</h1><p id="status" role="status">読み込み中…</p></header>
  <main>
    <section class="actions">
      <button id="new-folder" type="button">フォルダを作成</button>
      <button id="add-file" type="button">scoreから追加</button>
      <button id="open-folder" type="button">このフォルダを開く</button>
      <button id="repair" type="button">リンクを検査</button>
    </section>
    <nav id="breadcrumbs" aria-label="現在のフォルダ"></nav>
    <ul id="entries" aria-label="ブックマーク一覧"></ul>
  </main>
  <dialog id="picker">
    <form method="dialog"><h2>scoreからファイルを追加</h2><p id="picker-path"></p><nav id="picker-breadcrumbs"></nav><ul id="picker-entries"></ul><menu><button value="cancel">閉じる</button></menu></form>
  </dialog>
  <script src="setoli.js"></script>
</body>
</html>
